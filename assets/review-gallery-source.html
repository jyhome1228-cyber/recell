  /* =========================================================

  ELEMENT

  ========================================================= */



  var section =

    document.getElementById("reEcloReviewGallery");



  var track =

    document.getElementById("reEcloReviewTrack");



  var modal =

    document.getElementById("reEcloReviewModal");



  if (!section || !track || !modal) return;





  /* =========================================================

  CREATE CARDS

  ========================================================= */



  reviews.forEach(function (review, index) {



    var card =

      document.createElement("article");



    card.className =

      "re-review-card";



    card.setAttribute(

      "data-review-index",

      index

    );





    card.innerHTML =



      '<div class="re-review-image">' +



        '<img src="' +

        review.image +

        '" alt="리셀에클로 리뷰 이미지" loading="lazy">' +



      '</div>' +





      '<div class="re-review-content">' +



        '<div class="re-review-meta">' +



          '<span class="re-review-stars">' +

          review.stars +

          '</span>' +



          '<span class="re-review-user">' +

          review.user +

          '</span>' +



        '</div>' +





        '<p class="re-review-copy">' +

        review.text +

        '</p>' +





        '<div class="re-review-card-bottom">' +



          '<span class="re-review-tag">' +

          review.tag +

          '</span>' +



          '<span class="re-review-more">' +

          '상세보기 +' +

          '</span>' +



        '</div>' +



      '</div>';





    track.appendChild(card);



  });





  var cards =

    track.querySelectorAll(".re-review-card");



  var prev =

    section.querySelector(".re-review-prev");



  var next =

    section.querySelector(".re-review-next");



  var currentText =

    section.querySelector(".re-review-current");



  var progress =

    section.querySelector(".re-review-progress");





  /* =========================================================

  MODAL

  ========================================================= */



  var modalImg =

    modal.querySelector(".re-modal-img");



  var modalStars =

    modal.querySelector(".re-modal-stars");



  var modalCopy =

    modal.querySelector(".re-modal-copy");



  var modalUser =

    modal.querySelector(".re-modal-user");



  var modalTag =

    modal.querySelector(".re-modal-tag");



  var modalClose =

    modal.querySelector(".re-modal-close");





  function openReview(index) {



    var review =

      reviews[index];



    if (!review) return;





    modalImg.src =

      review.image;



    modalStars.textContent =

      review.stars;



    modalCopy.textContent =

      review.text;



    modalUser.textContent =

      review.user;



    modalTag.textContent =

      review.tag;





    modal.classList.add("is-open");



    document.body.style.overflow =

      "hidden";





    requestAnimationFrame(function () {



      requestAnimationFrame(function () {



        modal.classList.add(

          "is-visible"

        );



      });



    });



  }





  function closeReview() {



    modal.classList.remove(

      "is-visible"

    );



    document.body.style.overflow =

      "";





    setTimeout(function () {



      modal.classList.remove(

        "is-open"

      );



    }, 250);



  }





  /* =========================================================

  CARD CLICK

  ========================================================= */



  cards.forEach(function (card) {



    card.addEventListener(

      "click",

      function () {



        if (dragMoved) return;



        var index =

          parseInt(

            card.getAttribute(

              "data-review-index"

            ),

            10

          );



        openReview(index);



      }

    );



  });





  modalClose.addEventListener(

    "click",

    closeReview

  );





  modal.addEventListener(

    "click",

    function (e) {



      if (e.target === modal) {



        closeReview();



      }



    }

  );





  document.addEventListener(

    "keydown",

    function (e) {



      if (e.key === "Escape") {



        closeReview();



      }



    }

  );





  /* =========================================================

  SLIDE SIZE

  ========================================================= */



  function getStep() {



    var first =

      cards[0];



    if (!first) return 300;





    var style =

      window.getComputedStyle(track);



    var gap =

      parseFloat(

        style.columnGap ||

        style.gap

      ) || 0;





    return (

      first.getBoundingClientRect().width +

      gap

    );



  }





  /* =========================================================

  INDEX

  ========================================================= */



  function updateIndex() {



    var step =

      getStep();



    var index =

      Math.round(

        track.scrollLeft / step

      );





    index =

      Math.max(

        0,

        Math.min(

          index,

          reviews.length - 1

        )

      );





    currentText.textContent =

      String(index + 1).padStart(

        2,

        "0"

      );





    var percentage =

      ((index + 1) /

        reviews.length) * 100;





    progress.style.width =

      Math.max(

        5,

        percentage

      ) + "%";



  }





  /* =========================================================

  ARROWS

  ========================================================= */



  prev.addEventListener(

    "click",

    function () {



      track.scrollBy({

        left: -getStep(),

        behavior: "smooth"

      });



    }

  );





  next.addEventListener(

    "click",

    function () {



      var maxScroll =

        track.scrollWidth -

        track.clientWidth;





      if (

        track.scrollLeft >=

        maxScroll - 10

      ) {



        track.scrollTo({

          left: 0,

          behavior: "smooth"

        });



      } else {



        track.scrollBy({

          left: getStep(),

          behavior: "smooth"

        });



      }



    }

  );





  /* =========================================================

  DRAG

  ========================================================= */



  var isDown = false;



  var dragMoved = false;



  var startX = 0;



  var startScrollLeft = 0;





  track.addEventListener(

    "mousedown",

    function (e) {



      isDown = true;



      dragMoved = false;



      startX =

        e.pageX;



      startScrollLeft =

        track.scrollLeft;



      track.classList.add(

        "is-dragging"

      );



    }

  );





  track.addEventListener(

    "mousemove",

    function (e) {



      if (!isDown) return;





      var moveX =

        e.pageX - startX;





      if (

        Math.abs(moveX) > 5

      ) {



        dragMoved = true;



      }





      track.scrollLeft =

        startScrollLeft -

        moveX;



    }

  );





  window.addEventListener(

    "mouseup",

    function () {



      if (!isDown) return;



      isDown = false;



      track.classList.remove(

        "is-dragging"

      );





      setTimeout(function () {



        dragMoved = false;



      }, 50);



    }

  );





  /* =========================================================

  SCROLL

  ========================================================= */



  var ticking = false;





  track.addEventListener(

    "scroll",

    function () {



      if (!ticking) {



        requestAnimationFrame(

          function () {



            updateIndex();



            ticking = false;



          }

        );



        ticking = true;



      }



    }

  );





  /* =========================================================

  AUTO ROLLING

  ========================================================= */



  var autoTimer = null;





  function stopAuto() {



    if (autoTimer) {



      clearInterval(

        autoTimer

      );



      autoTimer = null;



    }



  }





  function startAuto() {



    stopAuto();





    autoTimer =

      setInterval(

        function () {



          if (

            window.innerWidth <=

            767

          ) return;





          var maxScroll =

            track.scrollWidth -

            track.clientWidth;





          if (

            track.scrollLeft >=

            maxScroll - 10

          ) {



            track.scrollTo({

              left: 0,

              behavior: "smooth"

            });



          } else {



            track.scrollBy({

              left: getStep(),

              behavior: "smooth"

            });



          }



        },

        4200

      );



  }





  section.addEventListener(

    "mouseenter",

    stopAuto

  );



  section.addEventListener(

    "mouseleave",

    startAuto

  );





  track.addEventListener(

    "touchstart",

    stopAuto,

    { passive: true }

  );





  track.addEventListener(

    "touchend",

    startAuto,

    { passive: true }

  );





  updateIndex();



  startAuto();



})();

</script>
