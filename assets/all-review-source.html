function formatDate(date) {



const y = date.getFullYear();



const m =

String(date.getMonth()+1)

.padStart(2,"0");



const d =

String(date.getDate())

.padStart(2,"0");



return `${y}.${m}.${d}`;



}





const extraDates = [];



dates2026.forEach(

date => extraDates.push(date)

);





/* 대부분 2025 */



let date =

new Date(2025,11,30);



for(let i=0;i<72;i++){



extraDates.push(

formatDate(date)

);



date.setDate(

date.getDate()-5

);



}

/* =========================================================

   +88 REVIEWS

========================================================= */



const fourStars =

new Set([

8,17,26,39,53,64,75,83

]);





for(let i=0;i<88;i++){



const copyIndex =

i % reviewCopy.length;



const extraIndex =

i % extraTitles.length;





/*

}else{

reviews.push({

/* =========================================================

   STATE

========================================================= */



let currentFilter =

"latest";



let currentPage =

1;



const perPage =

10;





const listEl =

document.getElementById(

"rcReviewList"

);



const paginationEl =

document.getElementById(

"rcPagination"

);





/* =========================================================

   POPUP

========================================================= */



const modal =

document.getElementById(

"rcMemberModal"

);



const write =

document.getElementById(

"rcWriteReview"

);



const close =

document.getElementById(

"rcMemberClose"

);



const confirm =

document.getElementById(

"rcMemberConfirm"

);





function openModal(){



modal.classList.add(

"show"

);



document.body.style.overflow =

"hidden";



}





function closeModal(){



modal.classList.remove(

"show"

);



document.body.style.overflow =

"";



}





write.addEventListener(

"click",

openModal

);



close.addEventListener(

"click",

closeModal

);



confirm.addEventListener(

"click",

closeModal

);





modal.addEventListener(

"click",

function(e){



if(e.target === modal){

closeModal();

}



}

);





document.addEventListener(

"keydown",

function(e){



if(e.key === "Escape"){

closeModal();

}



}

);





/* =========================================================

   HELPERS

========================================================= */



function getStars(rating){



return (

"★".repeat(rating) +

"☆".repeat(5-rating)

);



}





function dateValue(date){



return Number(

date.replaceAll(".","")

);



}





/* =========================================================

   FILTER

========================================================= */



function getData(){



let data =

[...reviews];





if(

currentFilter ===

"latest"

){



data.sort(

(a,b) =>

dateValue(b.date) -

dateValue(a.date)

);



}





if(

currentFilter ===

"rating"

){



data.sort(

(a,b) => {



if(

b.rating !==

a.rating

){



return (

b.rating -

a.rating

);



}



return (

dateValue(b.date) -

dateValue(a.date)

);



}

);



}





if(

currentFilter ===

"photo"

){



data =

data.filter(

item =>

Boolean(item.photo)

);



data.sort(

(a,b) =>

dateValue(b.date) -

dateValue(a.date)

);



}





return data;



}





/* =========================================================

   RENDER

========================================================= */



function renderReviews(){



const data =

getData();



const start =

(currentPage-1) *

perPage;



const pageData =

data.slice(

start,

start+perPage

);





listEl.innerHTML =

pageData.map(

review => `



<article

class="rc-review-item"

>



<div

class="rc-review-rating"

>



<span

class="rc-review-stars"

>

${getStars(review.rating)}

</span>



<span

class="rc-review-rating-label"

>

${review.rating}.0

</span>



</div>





<div

class="rc-review-content"

>



<div

class="rc-review-content-top"

>



${

review.photo

?

`

<span

class="rc-review-photo-badge"

>

PHOTO

</span>

`

:

""

}



<h3

class="rc-review-subject"

>

${review.subject}

</h3>



</div>





<p

class="rc-review-description"

>

${review.description}

</p>



</div>





<div

class="rc-review-meta"

>



<span

class="rc-review-user"

>

${review.user}

</span>



<span>

${review.date}

</span>



</div>





${

review.photo

?

`

<div

class="rc-review-thumb"

>



<img

src="${review.photo}"

alt=""

loading="lazy"

>



</div>

`

:

`

<div

class="rc-review-thumb-empty"

></div>

`

}



</article>



`

).join("");





listEl

.querySelectorAll(

".rc-review-item"

)

.forEach(

item => {



item.addEventListener(

"click",

openModal

);



}

);





renderPagination(

data.length

);



}





/* =========================================================

   PAGINATION

========================================================= */



function renderPagination(total){



const totalPages =

Math.ceil(

total/perPage

);





if(totalPages<=1){



paginationEl.innerHTML =

"";



return;



}





let startPage =

Math.max(

1,

currentPage-2

);





let endPage =

Math.min(

totalPages,

startPage+4

);





if(

endPage-startPage<4

){



startPage =

Math.max(

1,

endPage-4

);



}





let html = `



<button

type="button"

data-page="${currentPage-1}"

${currentPage===1 ? "disabled" : ""}

>

‹

</button>



`;





for(

let i=startPage;

i<=endPage;

i++

){



html += `



<button

type="button"

data-page="${i}"

class="${i===currentPage ? "active" : ""}"

>

${i}

</button>



`;



}





html += `



<button

type="button"

data-page="${currentPage+1}"

${currentPage===totalPages ? "disabled" : ""}

>

›

</button>



`;





paginationEl.innerHTML =

html;





paginationEl

.querySelectorAll(

"button[data-page]"

)

.forEach(

button => {



button.addEventListener(

"click",

function(){



if(this.disabled){

return;

}



currentPage =

Number(

this.dataset.page

);



renderReviews();





const y =

document

.querySelector(

".rc-review-toolbar"

)

.getBoundingClientRect()

.top +

window.pageYOffset -

110;





window.scrollTo({

top:y,

behavior:"smooth"

});



}

);



}

);



}





/* =========================================================

   FILTER BUTTON

========================================================= */



document

.querySelectorAll(

".rc-review-filter button"

)

.forEach(

button => {



button.addEventListener(

"click",

function(){



document

.querySelectorAll(

".rc-review-filter button"

)

.forEach(

btn =>

btn.classList.remove(

"active"

)

);





this.classList.add(

"active"

);





currentFilter =

this.dataset.filter;



currentPage =

1;



renderReviews();



}

);



}

);





/* =========================================================

   COUNT

========================================================= */



document

.getElementById(

"rcReviewCount"

)

.textContent =

reviews.length +

" reviews";





/* =========================================================

   AVERAGE

========================================================= */



const average =

reviews.reduce(

(sum,item) =>

sum+item.rating,

0

) /

reviews.length;





document

.getElementById(

"rcAverageScore"

)

.textContent =

average.toFixed(1);





/* INIT */



renderReviews();



})();

</script>
